@defer (on viewport) {
    <div class="w-[80%] md:w-[600px] text-slate-200 mx-auto mt-3 mb-20">
        <p>I have an AI Chat bot that helps you understand me more.</p>
        <p>Click the "Chat" icon at the lower right corner of the page now!</p>
        <div class="fixed bottom-[75px] right-10 animate-bounce">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </div>
    </div>
} @placeholder {
    <p class="text-center text-slate-400 italic mt-3" aria-label="loading contents">loading...</p>
}
